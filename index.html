<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakinko´s Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════════
       TOP BAR
  ══════════════════════════════════════════════════════════════════ -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">🌐</span>
      <span class="topbar-title">Sakinko´s Editor</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-new"    class="btn btn-ghost" title="New document">New</button>
      <button id="btn-copy"   class="btn btn-ghost" title="Copy raw BBCode">Copy BBCode</button>
      <button id="btn-import" class="btn btn-ghost" title="Import BBCode from file">Import</button>
      <button id="btn-export" class="btn btn-ghost" title="Save as .txt">Export</button>
      <input  id="file-input" type="file" accept=".txt" style="display:none" />
      <label class="toggle-wrap" title="Toggle dark / light theme">
        <input type="checkbox" id="theme-toggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Dark</span>
      </label>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════════
       MODE TABS
  ══════════════════════════════════════════════════════════════════ -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-dispatch" data-mode="dispatch">Dispatch</button>
    <button class="mode-tab"        id="tab-forum"    data-mode="forum">Forum</button>
    <span class="mode-hint" id="mode-hint">Dispatch mode — all NS tags available</span>
  </div>

  <!-- ══════════════════════════════════════════════════════════════
       TOOLBAR
  ══════════════════════════════════════════════════════════════════ -->
  <div class="toolbar" id="toolbar">

    <!-- ── Basic inline ──────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Text</span>
      <button class="tb-btn" data-tag="b"      title="Bold [b]"><b>B</b></button>
      <button class="tb-btn" data-tag="i"      title="Italic [i]"><i>I</i></button>
      <button class="tb-btn" data-tag="u"      title="Underline [u]"><u>U</u></button>
      <button class="tb-btn" data-tag="strike" title="Strikethrough [strike]"><s>S</s></button>
      <button class="tb-btn" data-tag="sup"    title="Superscript [sup]">x²</button>
      <button class="tb-btn" data-tag="sub"    title="Subscript [sub]">x₂</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Size ──────────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Size</span>
      <button class="tb-btn tb-prompt" data-tag="size" data-prompt="Size % (e.g. 150 = large, 75 = small)" data-default="150" title="Text size [size=N]">Normal</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Colour ────────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Colour</span>
      <span class="color-picker-wrap" title="Font colour [color=…]">
        <label class="tb-btn color-btn" for="pick-color">A</label>
        <input type="color" id="pick-color" value="#ff0000" />
      </span>
      <span class="color-picker-wrap" title="Text highlight [background=…]">
        <label class="tb-btn color-btn bg-btn" for="pick-bg">H</label>
        <input type="color" id="pick-bg" value="#ffff00" />
      </span>
      <!-- Block background — dispatch only -->
      <span class="color-picker-wrap dispatch-only" title="Block background [background-block=…]">
        <label class="tb-btn color-btn block-btn" for="pick-block">BG</label>
        <input type="color" id="pick-block" value="#1a1a2e" />
      </span>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Alignment ─────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Align</span>
      <button class="tb-btn" data-wrap="[align=left]"    data-wrapclose="[/align]" title="Align left">⇤</button>
      <button class="tb-btn" data-wrap="[align=center]"  data-wrapclose="[/align]" title="Centre">⇔</button>
      <button class="tb-btn" data-wrap="[align=right]"   data-wrapclose="[/align]" title="Align right">⇥</button>
      <button class="tb-btn" data-wrap="[align=justify]" data-wrapclose="[/align]" title="Justify">≡</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Misc inline ───────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Misc</span>
      <button class="tb-btn" data-tag="hr" data-selfclose="true" title="Horizontal rule [hr]">HR</button>
      <button class="tb-btn" data-tag="pre" title="Preformatted [pre]">PRE</button>
      <button class="tb-btn forum-only" data-tag="code" title="Code block [code] — forum only">Code</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Links & Media ─────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Link &amp; Media</span>
      <button class="tb-btn" id="btn-url" title="Insert link [url=…]">URL</button>
      <button class="tb-btn" id="btn-img" title="Insert image [img]">IMG</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Blocks ────────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Blocks</span>
      <button class="tb-btn dispatch-only" data-tag="box"     title="Box [box] — dispatch only">Box</button>
      <button class="tb-btn" id="btn-quote"                   title="Quote [quote=…]">Quote</button>
      <button class="tb-btn" id="btn-spoiler"                 title="Spoiler [spoiler]">Spoiler</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Float & Tab — dispatch only ──────────────────────────── -->
    <div class="toolbar-group dispatch-only">
      <span class="toolbar-group-label">Float</span>
      <button class="tb-btn" data-wrap="[floatleft]"  data-wrapclose="[/floatleft]"  title="Float left [floatleft]">◧ Left</button>
      <button class="tb-btn" data-wrap="[floatright]" data-wrapclose="[/floatright]" title="Float right [floatright]">◨ Right</button>
      <button class="tb-btn tb-prompt" data-tag="tab" data-prompt="Indent pixels (e.g. 30)" data-default="30" title="Tab indent [tab=N]">Tab=</button>
    </div>

    <div class="toolbar-sep dispatch-only"></div>

    <!-- ── NS Links — dispatch only ──────────────────────────────── -->
    <div class="toolbar-group dispatch-only">
      <span class="toolbar-group-label">NS Links</span>
      <button class="tb-btn" id="btn-nation"                                                              title="Nation link [nation]">Nation</button>
      <button class="tb-btn" id="btn-region"                                                              title="Region link [region]">Region</button>
      <button class="tb-btn" data-wrap="[region-tag]"  data-wrapclose="[/region-tag]"                    title="Region tag [region-tag]">R-Tag</button>
      <button class="tb-btn tb-prompt" data-tag="region-tag" data-prompt="Region name" data-default=""   title="Region tag with name [region-tag=name]" id="btn-region-tag-param">R-Tag=</button>
      <button class="tb-btn tb-prompt" data-tag="proposal"   data-prompt="Proposal ID" data-default=""   title="WA Proposal [proposal=id]">Prop=</button>
    </div>

    <div class="toolbar-sep dispatch-only"></div>

    <!-- ── Lists ─────────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Lists</span>
      <button class="tb-btn" id="btn-ul"                          title="Bullet list [list]">List</button>
      <button class="tb-btn" id="btn-ol"                          title="Numbered list [list=1]">List=</button>
      <button class="tb-btn" data-wrap="[*]" data-wrapclose=""    title="List item [*]">[*]</button>
    </div>

    <div class="toolbar-sep"></div>

    <!-- ── Tables ────────────────────────────────────────────────── -->
    <div class="toolbar-group">
      <span class="toolbar-group-label">Table</span>
      <button class="tb-btn" id="btn-table"                        title="Insert table scaffold">Table</button>
      <button class="tb-btn" data-wrap="[tr]" data-wrapclose="[/tr]" title="Table row [tr]">TR</button>
      <button class="tb-btn" data-wrap="[td]" data-wrapclose="[/td]" title="Table cell [td]">TD</button>
    </div>

  </div><!-- /toolbar -->

  <!-- ══════════════════════════════════════════════════════════════
       MAIN AREA  (editor | preview)
  ══════════════════════════════════════════════════════════════════ -->
  <main class="workspace">

    <section class="pane pane-editor">
      <div class="pane-header">
        <span class="pane-title">BBCode <span class="mode-badge" id="editor-mode-badge">Dispatch</span></span>
        <div class="pane-header-right">
          <span id="char-count" class="char-count">0 chars</span>
          <button class="btn btn-xs" id="btn-undo"  title="Undo">↩</button>
          <button class="btn btn-xs" id="btn-redo"  title="Redo">↪</button>
          <button class="btn btn-xs" id="btn-clear" title="Clear all">✕</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Start typing your BBCode here…"></textarea>
    </section>

    <div class="resizer" id="resizer" title="Drag to resize"></div>

    <section class="pane pane-preview">
      <div class="pane-header">
        <span class="pane-title">Preview</span>
        <div class="pane-header-right">
          <button class="btn btn-xs" id="btn-copy-preview" title="Copy preview HTML">Copy HTML</button>
          <label class="mini-toggle-wrap" title="Sync scroll with editor">
            <input type="checkbox" id="sync-scroll" checked />
            <span class="mini-label">Sync scroll</span>
          </label>
        </div>
      </div>
      <div id="preview" class="preview-body ns-content"></div>
    </section>

  </main>

  <!-- ══════════════════════════════════════════════════════════════
       STATUS BAR
  ══════════════════════════════════════════════════════════════════ -->
  <footer class="statusbar">
    <span id="status-msg" class="status-msg">Ready</span>
    <span class="status-right">
      <span id="word-count" class="word-count">0 words</span>
      <span class="status-sep">·</span>
      <span id="line-count" class="line-count">1 line</span>
    </span>
  </footer>

  <!-- ══════════════════════════════════════════════════════════════
       MODAL
  ══════════════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modal-title" class="modal-title"></span>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-ghost">Cancel</button>
        <button id="modal-ok"     class="btn btn-primary">Insert</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════
       TOAST
  ══════════════════════════════════════════════════════════════════ -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
